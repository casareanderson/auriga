<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="system-ui, sans-serif">
  <!-- Background -->
  <rect width="700" height="400" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Auriga Architecture</text>

  <!-- Your Chrome box (top left) -->
  <rect x="30" y="55" width="150" height="70" rx="4" fill="#fff" stroke="#dc3545" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="105" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Your Chrome</text>
  <text x="105" y="105" text-anchor="middle" font-size="10" fill="#666">same tabs, same logins</text>

  <!-- Tool / Model box -->
  <rect x="30" y="170" width="140" height="70" rx="4" fill="#fff" stroke="#0d6efd" stroke-width="2"/>
  <text x="100" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d6efd">Tool / Model</text>
  <text x="100" y="220" text-anchor="middle" font-size="10" fill="#666">HTTP client or curl</text>

  <!-- Arrow from Tool to Bridge -->
  <line x1="170" y1="205" x2="280" y2="205" stroke="#666" stroke-width="1.5"/>
  <polygon points="280,200 290,205 280,210" fill="#666"/>
  <text x="215" y="198" font-size="9" fill="#888">POST /command</text>

  <!-- Auriga bridge -->
  <rect x="280" y="175" width="160" height="80" rx="4" fill="#fff" stroke="#198754" stroke-width="2"/>
  <text x="360" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#198754">auriga.py (bridge)</text>
  <text x="360" y="225" text-anchor="middle" font-size="10" fill="#666">localhost:8765</text>
  <text x="360" y="242" text-anchor="middle" font-size="9" fill="#999">loopback only · stdlib</text>

  <!-- Long-poll arrow back from Extension -->
  <line x1="510" y1="215" x2="590" y2="215" stroke="#0d6efd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="590,210 600,215 590,220" fill="#0d6efd"/>
  <text x="545" y="208" font-size="9" fill="#0d6efd">GET /poll</text>

  <!-- Result arrow back from Extension -->
  <line x1="510" y1="230" x2="440" y2="230" stroke="#666" stroke-width="1.5"/>
  <polygon points="440,225 430,230 440,235" fill="#666"/>
  <text x="475" y="223" font-size="9" fill="#888">POST /result</text>

  <!-- Chrome extension -->
  <rect x="590" y="175" width="100" height="80" rx="4" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#fd7e14">Chrome ext.</text>
  <text x="640" y="218" text-anchor="middle" font-size="9" fill="#666">Service Worker</text>
  <text x="640" y="234" text-anchor="middle" font-size="9" fill="#999">CDP + chrome.* APIs</text>

  <!-- Browser area -->
  <rect x="590" y="75" width="100" height="70" rx="4" fill="#fff" stroke="#6c757d" stroke-width="1"/>
  <text x="640" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#495057">Browser page</text>
  <text x="640" y="125" text-anchor="middle" font-size="10" fill="#666">content script</text>

  <!-- From Chrome to browser page -->
  <line x1="105" y1="125" x2="105" y2="90" stroke="#666" stroke-width="1"/>
  <line x1="105" y1="90" x2="590" y2="90" stroke="#666" stroke-width="1"/>
  <line x1="590" y1="90" x2="590" y2="145" stroke="#666" stroke-width="1"/>
  <polyline points="590,140 595,145 585,145" fill="none" stroke="#666" stroke-width="1.5"/>

  <!-- Audit log -->
  <rect x="280" y="290" width="160" height="50" rx="4" fill="#f0f0f0" stroke="#adb5bd" stroke-width="1"/>
  <text x="360" y="313" text-anchor="middle" font-size="11" fill="#333">Audit log</text>
  <text x="360" y="330" text-anchor="middle" font-size="9" fill="#888">~/.auriga/audit.jsonl</text>

  <!-- Arrows down from bridge to audit -->
  <line x1="340" y1="255" x2="310" y2="290" stroke="#666" stroke-width="1.5"/>
  <line x1="380" y1="255" x2="410" y2="290" stroke="#666" stroke-width="1.5"/>

  <!-- Optional Ephor ship (left of audit) -->
  <rect x="80" y="290" width="150" height="50" rx="4" fill="#f0f0f0" stroke="#6c757d" stroke-width="1"/>
  <text x="155" y="313" text-anchor="middle" font-size="11" fill="#495057">Ephor ingest</text>
  <text x="155" y="330" text-anchor="middle" font-size="9" fill="#888">optional</text>
  <line x1="360" y1="290" x2="230" y2="305" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="280" y="297" font-size="8" fill="#aaa">ship_to_ephor()</text>

  <!-- CLI wrapper -->
  <rect x="30" y="355" width="140" height="50" rx="4" fill="#fff" stroke="#6c757d" stroke-width="1"/>
  <text x="100" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#495057">CLI wrapper</text>
  <text x="100" y="395" text-anchor="middle" font-size="9" fill="#888">./auriga &lt;action&gt;</text>

  <!-- Auto-start from CLI -->
  <line x1="100" y1="355" x2="100" y2="240" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="108" y="295" font-size="9" fill="#999">auto-starts bridge</text>
</svg>
